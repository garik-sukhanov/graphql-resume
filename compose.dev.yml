services:
  db:
    ports:
      - "5432:5432"
  api:
    image: graphql-resume
    restart: unless-stopped
    volumes:
      - ./:/app
      - /app/node_modules
    env_file:
      - .env
    build:
      context: .
      target: dev
    ports:
      - "9229:9229"
    depends_on:
      db:
        condition: service_healthy
